<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陌生二维码不要扫</title>
<style>
  :root{
    --bg:#eaf4fc;
    --bg2:#dbeaf7;
    --ink:#2c3e50;
    --ink-soft:#5d7a8c;
    --gray:#8fa9ba;
    --line:#b8d4e8;
    --accent:#6b9ec7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    font-size:17px;
    line-height:1.85;
    letter-spacing:.02em;
    overflow-x:hidden;
    position:relative;
  }
  
  /* 小鱼背景 */
  .fish-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .fish{position:absolute;opacity:0.5;animation:swim linear infinite;}
  @keyframes swim{
    0%{transform:translateX(110vw) translateY(0);}
    100%{transform:translateX(-20vw) translateY(-15px);}
  }
  .fish svg{
    display:block;
    filter: drop-shadow(0 4px 6px rgba(107, 158, 199, 0.15)); /* 柔和光晕 */
  }
  
  #app{
    position:relative;z-index:1;
    max-width:680px;margin:0 auto;
    min-height:100%;padding:28px 22px 90px;
  }
  .page{animation:fade .45s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .stage{white-space:pre-wrap;word-break:break-word;}
  .stage p{margin:0 0 1.1em;}
  .stage p:last-child{margin-bottom:0;}
  .gray{color:var(--gray);}
  .bold{font-weight:700;}
  .big{font-size:1.25em;font-weight:700;letter-spacing:.06em;}
  .cursor{display:inline-block;width:.5em;height:1.05em;vertical-align:-.15em;margin-left:2px;background:var(--ink);opacity:.55;animation:blink .9s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}
  .hint{margin-top:14px;font-size:13px;color:var(--ink-soft);opacity:.75;text-align:right;user-select:none;}
  .panel{margin-top:18px;background:#f4f9fd;border:1px solid var(--line);border-radius:12px;padding:14px;}
  .row{display:flex;gap:8px;}
  input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;}
  input[type=text]:focus{border-color:var(--accent);}
  button{font:inherit;font-size:15px;color:#fff;background:var(--accent);border:none;border-radius:9px;padding:10px 16px;cursor:pointer;transition:opacity .2s;}
  button:active{opacity:.75;}
  button.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .tip{margin-top:10px;font-size:14px;color:var(--ink-soft);display:none;}
  .tip.show{display:block;}
  .err{margin-top:8px;font-size:14px;color:#c05b4d;display:none;}
  .err.show{display:block;}
  .wheel-wrap{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;user-select:none;}
  .wheel-unit{display:flex;align-items:center;gap:8px;}
  .wheel-label{font-size:15px;color:var(--ink-soft);}
  .wheel{position:relative;height:132px;width:64px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;}
  .wheel:before,.wheel:after{content:"";position:absolute;left:0;right:0;height:34px;z-index:2;pointer-events:none;}
  .wheel:before{top:0;background:linear-gradient(#fff,rgba(255,255,255,0));}
  .wheel:after{bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff);}
  .wheel-track{position:absolute;left:0;right:0;top:0;transition:transform .18s ease-out;}
  .wheel-item{height:44px;line-height:44px;text-align:center;font-size:20px;color:var(--ink);}
  .wheel-mid{position:absolute;left:0;right:0;top:44px;height:44px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);z-index:1;pointer-events:none;}
  .center{text-align:center;}
</style>
</head>

/* 生成真正可爱的小胖鱼（几何拼接版） */
(function(){
  var bg = document.getElementById('fishBg');
  // 清新可爱的浅蓝色系
  var colors = ['#7ab8f5', '#9ac9fa', '#b8d8fc', '#66a6ea', '#cbe4fd'];
  
  for(var i=0; i<12; i++){
    var d = document.createElement('div');
    d.className = 'fish';
    
    // 随机大小、位置、速度
    var size = 24 + Math.random()*30; 
    var top = 5 + Math.random()*85;   
    var dur = 25 + Math.random()*20;  
    var delay = Math.random()*25;     
    
    d.style.top = top + '%';
    d.style.animationDuration = dur + 's';
    d.style.animationDelay = '-' + delay + 's';
    d.style.opacity = 0.4 + Math.random()*0.4;
    
    var color = colors[Math.floor(Math.random()*colors.length)];
    
    // 用圆和三角形拼出完美的小胖鱼
    var svg = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">';
    // 鱼尾巴 (左侧的三角形，圆角处理)
    svg += '<path d="M14 20 Q8 12 4 16 Q6 20 4 24 Q8 28 14 20 Z" fill="'+color+'" opacity="0.8"/>';
    // 鱼身体 (右侧一个大圆，稍微压扁一点，更显胖)
    svg += '<ellipse cx="24" cy="20" rx="12" ry="9" fill="'+color+'"/>';
    // 鱼鳍 (背上的小半圆)
    svg += '<path d="M22 11 Q26 6 28 12 Z" fill="'+color+'" opacity="0.9"/>';
    // 眼睛 (白色加黑色瞳孔)
    svg += '<circle cx="31" cy="18" r="2.5" fill="#ffffff"/>';
    svg += '<circle cx="32" cy="18" r="1.2" fill="#2c3e50"/>';
    
    svg += '</svg>';
    d.innerHTML = svg;
    bg.appendChild(d);
  }
})();

/* 引擎与逻辑 */
var app = document.getElementById("app");
var idx = 0;
var typingTimer = null;
var typingDone = false;
var locked = false;

function clearTyping(){
  if(typingTimer){ clearInterval(typingTimer); typingTimer=null; }
}

function renderTypePage(step){
  var wrap = document.createElement("div");
  wrap.className = "page";
  var stage = document.createElement("div");
  stage.className = "stage";
  wrap.appendChild(stage);

  var normalLines = step.text.split("\n");
  var nodes = [];
  for(var i=0; i<normalLines.length; i++){
    var p = document.createElement("p");
    if(step.cls) p.className = step.cls;
    p.textContent = "";
    stage.appendChild(p);
    nodes.push({node:p, text:normalLines[i]});
  }

  var grayLines = [];
  if(step.gray){
    grayLines = step.gray.split("\n");
    for(var j=0; j<grayLines.length; j++){
      var gp = document.createElement("p");
      gp.className = "gray";
      gp.textContent = "";
      stage.appendChild(gp);
      nodes.push({node:gp, text:grayLines[j]});
    }
  }

  var hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = step.hint || "";
  wrap.appendChild(hint);
  
  app.innerHTML = "";
  app.appendChild(wrap);
  typingDone = false;

  var nodeIdx = 0, charIdx = 0;
  clearTyping();
  typingTimer = setInterval(function(){
    if(nodeIdx >= nodes.length){
      clearTyping();
      typingDone = true;
      if(step.afterDelay){
        locked = true;
        setTimeout(function(){
          locked = false;
          nextStep();
        }, step.afterDelay);
      }
      return;
    }
    var cur = nodes[nodeIdx];
    if(charIdx < cur.text.length){
      cur.node.textContent += cur.text.charAt(charIdx);
      charIdx++;
    } else {
      nodeIdx++;
      charIdx = 0;
    }
  }, TYPE_SPEED);
}

function fastForward(step){
  clearTyping();
  var wrap = document.createElement("div");
  wrap.className = "page";
  var stage = document.createElement("div");
  stage.className = "stage";
  wrap.appendChild(stage);

  step.text.split("\n").forEach(function(line){
    var p = document.createElement("p");
    if(step.cls) p.className = step.cls;
    p.textContent = line;
    stage.appendChild(p);
  });
  if(step.gray){
    step.gray.split("\n").forEach(function(line){
      var gp = document.createElement("p");
      gp.className = "gray";
      gp.textContent = line;
      stage.appendChild(gp);
    });
  }
  var hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = step.hint || "";
  wrap.appendChild(hint);
  
  app.innerHTML = "";
  app.appendChild(wrap);
  typingDone = true;
  
  if(step.afterDelay){
    locked = true;
    setTimeout(function(){
      locked = false;
      nextStep();
    }, step.afterDelay);
  }
}

function renderBirthday(step){
  var wrap = document.createElement("div");
  wrap.className = "page";
  var stage = document.createElement("div");
  stage.className = "stage";
  wrap.appendChild(stage);
  step.text.split("\n").forEach(function(line){
    var p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  });

  var wheelWrap = document.createElement("div");
  wheelWrap.className = "wheel-wrap";

  function makeWheel(label, min, max, init){
    var unit = document.createElement("div");
    unit.className = "wheel-unit";
    var lab = document.createElement("div");
    lab.className = "wheel-label";
    lab.textContent = label;
    var wheel = document.createElement("div");
    wheel.className = "wheel";
    var track = document.createElement("div");
    track.className = "wheel-track";
    for(var r=0; r<3; r++){
      for(var v=min; v<=max; v++){
        var it = document.createElement("div");
        it.className = "wheel-item";
        it.textContent = (v<10?"0":"")+v;
        track.appendChild(it);
      }
    }
    wheel.appendChild(track);
    var mid = document.createElement("div");
    mid.className = "wheel-mid";
    wheel.appendChild(mid);

    var oneSet = max-min+1;
    var offset = oneSet + (init-min);
    var ITEM_H = 44;
    
    function apply(){
      var center = wheel.clientHeight/2 - ITEM_H/2;
      track.style.transform = "translateY(" + (center - offset*ITEM_H) + "px)";
    }
    setTimeout(apply, 50);

    var startY=0, startOffset=0, dragging=false;
    function down(e){
      dragging=true;
      startY = e.touches ? e.touches[0].clientY : e.clientY;
      startOffset = offset;
    }
    function move(e){
      if(!dragging) return;
      var y = e.touches ? e.touches[0].clientY : e.clientY;
      var dy = y - startY;
      offset = startOffset - dy/ITEM_H;
      var minOff = oneSet;
      var maxOff = oneSet*2 - 1;
      if(offset < minOff) offset = minOff;
      if(offset > maxOff) offset = maxOff;
      apply();
      if(e.cancelable) e.preventDefault();
    }
    function up(){
      if(!dragging) return;
      dragging=false;
      offset = Math.round(offset);
      apply();
    }
    wheel.addEventListener("mousedown", down);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    wheel.addEventListener("touchstart", down, {passive:true});
    wheel.addEventListener("touchmove", move, {passive:false});
    wheel.addEventListener("touchend", up);

    unit.appendChild(lab);
    unit.appendChild(wheel);
    return {
      el: unit,
      getValue: function(){
        var i = Math.round(offset) - oneSet;
        return min + ((i % oneSet)+oneSet)%oneSet;
      }
    };
  }

  var monthW = makeWheel("月", 1, 12, 1);
  var dayW = makeWheel("日", 1, 31, 1);
  wheelWrap.appendChild(monthW.el);
  wheelWrap.appendChild(dayW.el);
  wrap.appendChild(wheelWrap);

  var hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = step.hint || "";
  wrap.appendChild(hint);

  var btnRow = document.createElement("div");
  btnRow.className = "panel";
  var btn = document.createElement("button");
  btn.textContent = "确认生日";
  btn.style.width = "100%";
  btnRow.appendChild(btn);
  wrap.appendChild(btnRow);

  var err = document.createElement("div");
  err.className = "err";
  err.textContent = "再想想？";
  wrap.appendChild(err);

  btn.onclick = function(){
    if(monthW.getValue() === 10 && dayW.getValue() === 12){
      nextStep();
    }else{
      err.classList.add("show");
    }
  };

  app.innerHTML = "";
  app.appendChild(wrap);
  typingDone = true;
}

function renderQuiz(step){
  var wrap = document.createElement("div");
  wrap.className = "page";
  var stage = document.createElement("div");
  stage.className = "stage";
  wrap.appendChild(stage);

  if(step.title){
    var t = document.createElement("p");
    t.className = "bold";
    t.textContent = step.title;
    stage.appendChild(t);
  }
  step.text.split("\n").forEach(function(line){
    var p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  });

  var panel = document.createElement("div");
  panel.className = "panel";

  var row = document.createElement("div");
  row.className = "row";
  var input = document.createElement("input");
  input.type = "text";
  input.placeholder = "输入答案";
  if(step.inputMode) input.inputMode = step.inputMode;
  var okBtn = document.createElement("button");
  okBtn.textContent = "提交";
  row.appendChild(input);
  row.appendChild(okBtn);
  panel.appendChild(row);

  if(step.hintText){
    var tipBtn = document.createElement("button");
    tipBtn.className = "ghost";
    tipBtn.textContent = "提示";
    tipBtn.style.marginTop = "10px";
    tipBtn.style.fontSize = "13px";
    tipBtn.style.padding = "7px 12px";
    panel.appendChild(tipBtn);

    var tip = document.createElement("div");
    tip.className = "tip";
    tip.textContent = step.hintText;
    panel.appendChild(tip);
    tipBtn.onclick = function(){ tip.classList.toggle("show"); };
  }

  var err = document.createElement("div");
  err.className = "err";
  err.textContent = "不对哦，再试试。";
  panel.appendChild(err);

  wrap.appendChild(panel);
  app.innerHTML = "";
  app.appendChild(wrap);
  typingDone = true;

  function submit(){
    var val = norm(input.value);
    if(!val){ err.classList.add("show"); return; }
    var ok = false;
    for(var i=0; i<step.answers.length; i++){
      if(norm(step.answers[i]) === val){ ok = true; break; }
    }
    if(ok){
      err.classList.remove("show");
      nextStep();
    }else{
      err.classList.add("show");
      input.focus();
    }
  }
  okBtn.onclick = submit;
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter") submit();
  });
}

function renderStep(step){
  if(step.type === "birthday"){ renderBirthday(step); return; }
  if(step.type === "quiz"){ renderQuiz(step); return; }
  renderTypePage(step);
}

function nextStep(){
  clearTyping();
  typingDone = false;
  idx++;
  if(idx >= script.length){
    var end = document.createElement("div");
    end.className = "page center";
    end.style.marginTop = "40vh";
    end.style.color = "var(--ink-soft)";
    end.textContent = "—— 完 ——";
    app.innerHTML = "";
    app.appendChild(end);
    return;
  }
  renderStep(script[idx]);
}

document.addEventListener("click", function(e){
  if(locked) return;
  var step = script[idx];
  if(!step) return;
  if(step.type === "quiz" || step.type === "birthday") return;
  if(e.target.closest("input,button,.panel,.wheel-wrap")) return;

  if(typingTimer){
    fastForward(step);
    return;
  }
  if(typingDone){
    nextStep();
  }
});

renderStep(script[0]);
</script>
